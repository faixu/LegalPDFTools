services:
  - type: web
    name: legalpdftools-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://legalbates.vercel.app,http://localhost:5173"
    autoDeploy: true

  - type: web
    name: legalpdftools-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm ci && npm run build"
    startCommand: "cd frontend && npx serve -s dist -l $PORT"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE
        value: "https://legalpdftools-backend.onrender.com/api"
    autoDeploy: true